<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وصل — لا يوجد اتصال</title>
<style>
  :root { --brand: #2f7e78; --bg: #f2f7f6; --ink: #1f2937; --muted: #6b7280; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 40px 28px; max-width: 420px; width: 100%;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08);
  }
  .logo {
    width: 76px; height: 76px; border-radius: 22px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  }
  h1 { font-size: 26px; margin-bottom: 6px; }
  .tag { color: var(--brand); font-size: 14px; margin-bottom: 22px; }
  h2 { font-size: 19px; margin-bottom: 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.9; margin-bottom: 24px; }
  button {
    width: 100%; border: 0; border-radius: 14px; background: var(--brand); color: #fff;
    font-size: 16px; font-weight: 600; padding: 14px; cursor: pointer;
  }
  button:active { opacity: .85; }
  .status { margin-top: 14px; font-size: 12px; color: var(--muted); min-height: 18px; }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>وصل</h1>
    <div class="tag">بقالة الحي في جوالك</div>
    <h2>لا يوجد اتصال بالإنترنت</h2>
    <p>تعذّر الوصول للخادم حالياً. تأكد من تشغيل البيانات أو الواي فاي، وسيعود التطبيق تلقائياً فور توفر الاتصال.</p>
    <button onclick="tryNow()">إعادة المحاولة الآن</button>
    <div class="status pulse" id="st">يجري فحص الاتصال تلقائياً…</div>
  </div>
<script>
  var st = document.getElementById("st");
  function goHome() { location.replace("/"); }
  function check() {
    fetch("/", { method: "HEAD", cache: "no-store" })
      .then(function (r) { if (r && (r.ok || r.type === "opaqueredirect")) goHome(); })
      .catch(function () {});
  }
  function tryNow() { st.textContent = "جاري المحاولة…"; check(); setTimeout(function(){ st.textContent = "يجري فحص الاتصال تلقائياً…"; }, 2500); }
  window.addEventListener("online", check);
  setInterval(check, 5000);
</script>
</body>
</html>
